name: Compilar CADe Linx para Windows y Linux

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Instalar dependencias y PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 🔨 Compilar ejecutable para Windows (.exe)
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "CADe_Linx_Win" main.py

      - name: 📤 Subir archivo .exe como artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: CADe-Linx-Windows-Portable
          path: dist/CADe_Linx_Win.exe
